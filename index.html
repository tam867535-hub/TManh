<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Cá Nhân</title>
    <style>
        body { font-family: 'Arial', sans-serif; line-height: 1.6; margin: 0; padding: 20px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; }
        .skill-tag { background: #3498db; color: white; padding: 5px 10px; border-radius: 5px; display: inline-block; margin: 5px; }
        footer { margin-top: 20px; font-size: 0.8em; text-align: center; color: #777; }
    </style>
</head>
<body>

<div class="container">
    <h1>Chào bạn, tôi là [Tên của bạn]</h1>
    <p>Tôi là một người đam mê công nghệ và đang trên con đường phát triển bản thân.</p>
    
    <h3>Kỹ năng</h3>
    <span class="skill-tag">HTML/CSS</span>
    <span class="skill-tag">JavaScript</span>
    <span class="skill-tag">Content Writing</span>
    
    <h3>Liên hệ</h3>
    <p>Email: example@email.com</p>
    <p>LinkedIn: linkedin.com/in/yourprofile</p>
</div>

<footer>Được tạo bởi AI Collaborator - 2026</footer>

</body>
</html>
